name: Container Security Scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Build and scan app01
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build app01 image
        run: docker build -t cyberlab-app01:ci ./app01

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: cyberlab-app01:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
